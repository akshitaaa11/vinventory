<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VInventory brings campus labs, equipment records, and lab teams into one shared workspace." />
    <script>try{const t=localStorage.getItem('vinventory-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.dataset.theme='dark';document.documentElement.classList.add('dark')}}catch{}</script>
    <title>VInventory — Your campus lab workspace</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/geist-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/geist-semibold.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
